<!DOCTYPE html>
<html>
    <head>
        <title>Random Quote Generator</title>
        <link rel="stylesheet" href="styles.css">
        <title>Group Portfolio</title>
        <meta charset="UTF-8">
        <meta name="description" content="A Random Qoute Generator that provides users with a random quote every time they click a button">
        <meta name="author" content="Thea Barrios, Prince Moran, and Crystal Sevilla">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <main class="main">
            <header>
                <h1>Random Quote Generator</h1>
            </header>

            <section aria-labelledby="quote-heading">
                <article>
                    <p id="quote">The quote for today is...</p>
                </article>

                <button type="button">This is the button if you didn't know</button>
            </section>
        </main>
    </body>
</html>
